// MetaFlux gRPC interface (v0 stub).
//
// The gateway will expose a far richer surface in S6+ once the internal
// gateway↔node mTLS gRPC channel is locked. For now this file defines just
// enough to compile a tonic stub that the SDK can re-export.

syntax = "proto3";

package metaflux.v1;

// Market-data streaming. Real wire formats land alongside the S6 gateway
// implementation; v0 keeps a minimal request / response so the build works.
service MarketDataService {
  // Stream fills for one market.
  rpc StreamFills(StreamFillsRequest) returns (stream Fill);
}

// Trading actions. Real per-action sub-messages will arrive in S6+; v0
// carries an opaque action_json + signature pair to unblock SDK build.
service TradingService {
  // Submit a signed action.
  rpc SubmitAction(SubmitActionRequest) returns (SubmitActionResponse);
}

message StreamFillsRequest {
  uint32 market_id = 1;
}

message Fill {
  uint64 ts_ms = 1;
  uint32 market_id = 2;
  uint64 px = 3;
  uint64 size = 4;
  string taker_side = 5; // "bid" | "ask"
}

message SubmitActionRequest {
  bytes action_json = 1;
  bytes signature = 2;
  uint64 nonce = 3;
}

message SubmitActionResponse {
  string status = 1;
  string error = 2;
}
