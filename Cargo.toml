[package]
name = "metaflux-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
resolver = "3"
authors = ["MTF Exchange contributors"]
license = "MIT"
description = "Rust SDK for the MetaFlux derivatives L1 — MTF-native protocol (REST + WS + gRPC), EIP-712 signing, full feature surface (RFQ / FBA / PM / CrossChain / EncryptedOrder)."
repository = "https://github.com/mtf-exchange/metaflux-client-rust"
homepage = "https://github.com/mtf-exchange/metaflux-client-rust"
documentation = "https://docs.rs/metaflux-client"
readme = "README.md"
keywords = ["metaflux", "mtf", "crypto", "perpetuals", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

# Per ADR-019: MTF-native only. HL migrants use `hyperliquid-rust-sdk` with
# base url https://api.mtf.xyz/hl-compat/. We do not carry HL-shape schema.

[features]
default = []
grpc = ["dep:tonic", "dep:prost"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

# HTTP / WS
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# Crypto
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
tiny-keccak = { version = "2", features = ["keccak"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utility
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
hex = "0.4"
bytes = "1"

# Optional — gRPC (gated)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

[dev-dependencies]
proptest = "1"
wiremock = "0.6"
tokio-test = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time", "net"] }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }

[[example]]
name = "submit_limit_order"
path = "examples/submit_limit_order.rs"

[[example]]
name = "stream_trades"
path = "examples/stream_trades.rs"

[[example]]
name = "create_vault"
path = "examples/create_vault.rs"

[lints.rust]
# Suppress "stop drumming" doc lints; require basic hygiene.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic adds value but is too noisy at scaffolding time — opt-in to
# the high-signal subset.
needless_return = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
# Trade-off documented: we accept f64 only in tests; production paths
# use u128 / i64.
float_arithmetic = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
