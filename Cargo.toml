[package]
name = "metaflux-client"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["MTF Exchange contributors"]
license = "MIT"
description = "Rust SDK for the MetaFlux derivatives L1 — REST + WebSocket, EIP-712 signing, and typed builders for the full signed-action surface (orders, TWAP, margin, vaults, staking, spot/Earn)."
repository = "https://github.com/mtf-exchange/metaflux-client-rust"
homepage = "https://github.com/mtf-exchange/metaflux-client-rust"
documentation = "https://docs.rs/metaflux-client"
readme = "README.md"
keywords = ["metaflux", "mtf", "crypto", "perpetuals", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

# `metaflux-client` is the primary crate; `facade/` publishes the short
# `metaflux` alias which simply re-exports this crate.
[workspace]
resolver = "3"
members = ["facade"]

[features]
default = ["cli"]
# Compiles the `mip3-deploy` CLI binary. On by default so `cargo install
# metaflux-client` ships the binary; library-only users can opt out via
# `default-features = false`.
cli = ["dep:clap"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

# HTTP / WS
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# Crypto
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
tiny-keccak = { version = "2", features = ["keccak"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utility
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
hex = "0.4"
bytes = "1"

# CLI (used by the `mip3-deploy` bin; gated behind `cli` feature so library
# users don't pull it in transitively).
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
wiremock = "0.6"
tokio-test = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time", "net"] }
assert_cmd = "2"

[[example]]
name = "submit_limit_order"
path = "examples/submit_limit_order.rs"

[[example]]
name = "stream_trades"
path = "examples/stream_trades.rs"

[[example]]
name = "create_vault"
path = "examples/create_vault.rs"

[[example]]
name = "mip3_full_deploy"
path = "examples/mip3_full_deploy.rs"

[[bin]]
name = "mip3-deploy"
path = "src/bin/mip3-deploy.rs"
required-features = ["cli"]

[lints.rust]
# Suppress "stop drumming" doc lints; require basic hygiene.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic adds value but is too noisy at scaffolding time — opt-in to
# the high-signal subset.
needless_return = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
# Trade-off documented: we accept f64 only in tests; production paths
# use u128 / i64.
float_arithmetic = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
